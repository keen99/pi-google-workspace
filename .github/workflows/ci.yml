name: CI

on:
  push:
    branches: [main, "test/**"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: NPM_WRAPPER_ALLOW_LOCAL=1 npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Tests + coverage
        run: npm run test:coverage
      - name: Upload coverage
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  matrix:
    name: Release matrix smoke (0.75.0 → latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Restore the newest saved .matrix-cache; save an updated one on success.
      - uses: actions/cache@v4
        with:
          path: .matrix-cache
          key: pi-matrix-${{ github.run_id }}
          restore-keys: pi-matrix-
      - name: Release matrix smoke
        run: npm run test:matrix
      - name: Sync tested tags
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node test/sync-tested-tags.mjs
