name: CI

on:
  push:
    branches: [main, "test/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: NPM_WRAPPER_ALLOW_LOCAL=1 npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Tests + coverage
        run: npm run test:coverage
      - name: Upload coverage
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
